<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowGo Dev Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a0814] text-white min-h-screen flex">

    <!-- Sidebar / Navigazione pagine -->
    <aside class="w-64 bg-white/5 backdrop-blur-2xl border-r border-white/10 p-6 flex flex-col justify-between">
        <div>
            <div class="flex items-center space-x-3 mb-10">
                <img id="userAvatar" src="" class="w-12 h-12 rounded-xl object-cover border border-white/20">
                <div>
                    <h2 id="userName" class="font-bold text-sm">Caricamento...</h2>
                    <span class="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider">Online Developer</span>
                </div>
            </div>

            <nav class="space-y-2">
                <a href="#" onclick="loadPage('dev/notifiche.html')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 text-sm font-medium transition">
                    <i class="fa-solid fa-bell text-rose-400"></i>
                    <span>Notifiche</span>
                </a>
                <a href="#" onclick="loadPage('dev/features.html')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 text-sm font-medium transition">
                    <i class="fa-solid fa-code text-indigo-400"></i>
                    <span>Features Preview</span>
                </a>
                <a href="#" onclick="loadPage('dev/admin.html')" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/10 text-sm font-medium transition">
                    <i class="fa-solid fa-database text-amber-400"></i>
                    <span>Admin</span>
                </a>
            </nav>
        </div>

        <button onclick="logout()" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-200 text-sm font-medium transition">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Disconnettiti</span>
        </button>
    </aside>

    <!-- Area Principale dei Contenuti -->
    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-8 flex justify-between items-center border-b border-white/10 pb-4">
            <h1 class="text-2xl font-extrabold tracking-tight">MeowGo Dashboard</h1>
            <span class="text-xs text-white/50">Ambiente di Sviluppo Protetto</span>
        </header>

        <!-- Contenuto Dinamico Caricato dalla cartella /sidebar/ -->
        <div id="contentArea" class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl min-h-[400px]">
            <h2 class="text-lg font-bold mb-2">Benvenuto nel pannello di controllo</h2>
            <p class="text-sm text-white/60">Seleziona una voce dalla barra laterale per caricare la pagina corrispondente dalla cartella <code class="bg-black/30 px-2 py-1 rounded text-rose-300">/sidebar/</code>.</p>
        </div>
    </main>

    <script>
        // Caricamento profilo utente da localStorage / sessione
        window.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('meowgo_sso_user'));
            if (!userData) {
                window.location.href = '../meowgo_dev_portal_sso_login.html'; // Ritorna al login se non autenticato
                return;
            }

            document.getElementById('userName').textContent = userData.name;
            document.getElementById('userAvatar').src = userData.avatar;
        });

        // Funzione per caricare le pagine della cartella /sidebar/ dinamicamente
        function loadPage(pageName) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<div class="flex justify-center items-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-rose-500"></i></div>`;
            
            fetch(`sidebar/${pageName}`)
                .then(response => {
                    if (!response.ok) throw new Error("Pagina non trovata");
                    return response.text();
                })
                .then(html => {
                    contentArea.innerHTML = html;
                })
                .catch(err => {
                    contentArea.innerHTML = `
                        <div class="text-center py-10">
                            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-400 mb-3"></i>
                            <h3 class="font-bold text-base">Modulo non ancora disponibile</h3>
                            <p class="text-xs text-white/60 mt-1">Crea il file <code class="text-rose-300">/sidebar/${pageName}</code> per visualizzarlo qui.</p>
                        </div>`;
                });
        }

        function logout() {
            localStorage.removeItem('meowgo_sso_user');
            window.location.href = '../meowgo_dev_portal_sso_login.html';
        }
    </script>
</body>
</html>
