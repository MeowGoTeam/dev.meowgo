<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b45309">
  <title>MeowGo - Registrati 🐾</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .form-card { max-width: 540px; margin: 0 auto; }
    .form-card a { color: #8b4513; }
    .form-control:focus { border-color: #b45309; box-shadow: 0 0 0 .2rem rgba(180,83,9,.15); }
    .action-link { border: 0; background: none; padding: 0; text-decoration: underline; color: #8b4513; }
  </style>
</head>
<body class="pb-5">
  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4 position-relative z-3">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="../feed/feed.html">
        <i class="fa-solid fa-cat" style="color:#b45309"></i> MeowGo
      </a>
    </div>
  </nav>
  <main class="container position-relative z-1">
    <div class="row justify-content-center py-4">
      <div class="col-md-8 col-lg-6">
        <section class="glass-card form-card p-4 p-md-5 text-center">
          <div class="fs-1 mb-2">🌿🐾</div>
          <h1 class="h2 fw-bold mb-1">Crea il tuo account</h1>
          <p class="text-muted small mb-4">Unisciti alla community MeowGo.</p>
          <div id="auth-message" class="alert d-none small p-2 mb-3" role="status" aria-live="polite"></div>
          <form id="register-form" novalidate>
            <div class="form-floating mb-3 text-start">
              <input type="text" class="form-control rounded-3" id="register-username" placeholder="CatMaster" minlength="2" maxlength="30" autocomplete="nickname" required>
              <label for="register-username">Nome utente (nickname)</label>
            </div>
            <div class="form-floating mb-3 text-start">
              <input type="email" class="form-control rounded-3" id="register-email" placeholder="nome@esempio.it" autocomplete="email" required>
              <label for="register-email">Email</label>
            </div>
            <div class="form-floating mb-3 text-start">
              <input type="password" class="form-control rounded-3" id="register-password" placeholder="Password" minlength="6" autocomplete="new-password" required>
              <label for="register-password">Password (almeno 6 caratteri)</label>
            </div>
            <div class="form-floating mb-4 text-start">
              <input type="password" class="form-control rounded-3" id="register-confirm-password" placeholder="Conferma password" minlength="6" autocomplete="new-password" required>
              <label for="register-confirm-password">Conferma password</label>
            </div>
            <button type="submit" id="register-submit" class="btn btn-earth btn-lg w-100 rounded-3 fw-bold shadow-sm">Crea account 🚀</button>
          </form>
          <div class="mt-3">
            <button type="button" class="action-link small" id="forgot-password-btn">Hai già un account ma hai dimenticato la password?</button>
          </div>
          <p class="small text-muted mt-4 mb-0">Hai già un account? <a href="login.html">Accedi</a></p>
          <p class="small text-muted mt-3 mb-0">Versione beta. Consulta <a href="../privacy/privacy.html">Privacy</a>, <a href="../terms/terms.html">Termini</a> e <a href="../community-rules/community-rules.html">Regole community</a>.</p>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="registrati.js"></script>
</body>
</html>
