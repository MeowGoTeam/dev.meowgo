<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowGo Dev Portal - SSO Access</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { meow: { 500: '#ff4d6d' } }
                }
            }
        }
    </script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0814;
        }

        /* Canvas principale per lo sfondo puro */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
        }

        /* Canvas sovrapposto per l'effetto rifrazione del vetro */
        #glassCanvas {
            position: absolute;
            top: 0; left: 0;
            border-radius: 32px;
            z-index: -1;
            /* Bagliore ai bordi per simulare la riflessione di Fresnel */
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 
                        0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Contenitore form allineato al canvas */
        .glass-container {
            position: relative;
            z-index: 10;
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
            outline: none;
        }
        
        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .liquid-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            border: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border-radius: 18px;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .liquid-btn:hover { 
            transform: scale(1.02); 
            background: #ffffff; 
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }
        
        .liquid-btn:active {
            transform: scale(0.98);
        }

        @keyframes subtleGlow {
            0%, 100% { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
            50% { border-color: rgba(255, 255, 255, 0.6); box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        }

        .dev-badge-glow {
            animation: subtleGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 font-sans text-white select-none min-h-screen">

    <!-- Canvas di Sfondo -->
    <canvas id="bgCanvas"></canvas>

    <main class="w-full max-w-md relative z-10 glass-container p-8 md:p-10" id="loginPanel">
        <!-- Canvas della Goccia / Lente Rifrattiva -->
        <canvas id="glassCanvas"></canvas>
        
        <div class="relative z-10">
            <!-- Brand Header -->
            <div class="flex flex-col items-center text-center mb-8">
                <div class="relative mb-4">
                    <div class="w-24 h-24 rounded-2xl overflow-hidden border border-white/20 shadow-2xl bg-black/20 p-1 flex items-center justify-center backdrop-blur-md">
                        <img src="https://i.ibb.co/6JvfGf4T/icon-192.jpg" class="w-full h-full object-cover rounded-xl" alt="MeowGo Dev Logo" onerror="this.onerror=null; this.src='https://placehold.co/192x192/000000/ffffff?text=MeowGo';">
                    </div>
                    <span class="absolute -bottom-2 right-1/2 translate-x-1/2 bg-black/60 backdrop-blur-xl text-[10px] font-black px-3 py-0.5 rounded-full border border-white/30 text-white tracking-widest uppercase shadow-lg whitespace-nowrap dev-badge-glow">
                        DEV SSO
                    </span>
                </div>
                
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white mt-1">MeowGo Portal</h1>
                <p class="text-xs text-white/60 font-medium mt-1">Accesso Riservato ai Developer</p>
            </div>

            <!-- Toast Alert -->
            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-xs font-semibold backdrop-blur-md transition-all duration-300"></div>

            <!-- Form Autenticazione -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label for="email" class="block text-[11px] font-semibold uppercase tracking-wider text-white/70 mb-1.5 ml-1">Email Developer</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-white/50">
                            <i class="fa-solid fa-envelope text-sm"></i>
                        </div>
                        <input type="email" id="email" required placeholder="developer@meowgo.it" autocomplete="email" class="glass-input w-full pl-10 pr-4 py-3.5 text-sm font-medium">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-[11px] font-semibold uppercase tracking-wider text-white/70 mb-1.5 ml-1">Password SSO</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-white/50">
                            <i class="fa-solid fa-shield-halved text-sm"></i>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••••••" autocomplete="current-password" class="glass-input w-full pl-10 pr-10 py-3.5 text-sm font-medium">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-white/50 hover:text-white transition">
                            <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="liquid-btn w-full py-4 px-4 font-semibold transition duration-300 flex items-center justify-center space-x-2.5 mt-4 group">
                    <span id="btnText" class="tracking-wide text-sm">Autenticati</span>
                    <i id="btnIcon" class="fa-solid fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                    <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden text-base"></i>
                </button>
            </form>

            <div class="mt-8 pt-4 border-t border-white/10 text-center">
                <p class="text-[11px] text-white/40 font-medium">
                    <i class="fa-solid fa-lock text-[10px] mr-1 text-white/60"></i>
                    Connessione Protetta • Hashing SHA-256
                </p>
            </div>
        </div>
    </main>

    <!-- SCRIPT 1: Effetto Rifrazione Lente (Canvas) -->
    <script>
        const bgImg = new Image();
        bgImg.src = 'dev/immagini/sso/gattosso.jpg';

        bgImg.onload = () => {
            initLiquidGlass();
            window.addEventListener('resize', initLiquidGlass);
        };

        function initLiquidGlass() {
            const bgCanvas = document.getElementById('bgCanvas');
            const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });
            const glassCanvas = document.getElementById('glassCanvas');
            const glassCtx = glassCanvas.getContext('2d');
            const panel = document.getElementById('loginPanel');

            const winW = window.innerWidth;
            const winH = window.innerHeight;
            bgCanvas.width = winW;
            bgCanvas.height = winH;

            const imgRatio = bgImg.width / bgImg.height;
            const winRatio = winW / winH;
            let drawW = winW, drawH = winH, offsetX = 0, offsetY = 0;
            
            if (winRatio > imgRatio) {
                drawH = winW / imgRatio;
                offsetY = (winH - drawH) / 2;
            } else {
                drawW = winH * imgRatio;
                offsetX = (winW - drawW) / 2;
            }
            
            bgCtx.drawImage(bgImg, offsetX, offsetY, drawW, drawH);
            
            // Gradiente scuro di fondo
            bgCtx.fillStyle = 'rgba(15, 10, 25, 0.4)';
            bgCtx.fillRect(0, 0, winW, winH);

            const rect = panel.getBoundingClientRect();
            const W = Math.round(rect.width);
            const H = Math.round(rect.height);
            const panelX = Math.round(rect.left);
            const panelY = Math.round(rect.top);

            glassCanvas.width = W;
            glassCanvas.height = H;

            try {
                const bgData = bgCtx.getImageData(0, 0, winW, winH);
                const src = bgData.data;
                const glassData = glassCtx.createImageData(W, H);
                const dst = glassData.data;

                const R = Math.min(W, H) / 2.5; 
                const k = -0.45; 
                const cx = W / 2;
                const cy = H / 2;

                for (let j = 0; j < H; j++) {
                    for (let i = 0; i < W; i++) {
                        let norm = Math.min(i, W - i, j, H - j) / R;
                        if (norm > 1) norm = 1; 
                        
                        let f = 1 + k * Math.pow(1 - norm, 2);

                        let sx = Math.round(cx + (i - cx) * f);
                        let sy = Math.round(cy + (j - cy) * f);

                        let globalX = panelX + sx;
                        let globalY = panelY + sy;

                        if (globalX >= 0 && globalX < winW && globalY >= 0 && globalY < winH) {
                            let srcIdx = (globalY * winW + globalX) * 4;
                            let dstIdx = (j * W + i) * 4;
                            
                            dst[dstIdx] = src[srcIdx];         
                            dst[dstIdx+1] = src[srcIdx+1];     
                            dst[dstIdx+2] = src[srcIdx+2];     
                            dst[dstIdx+3] = 255;               
                        }
                    }
                }
                glassCtx.putImageData(glassData, 0, 0);

                // Overlay frosted
                glassCtx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                glassCtx.fillRect(0, 0, W, H);

            } catch (e) {
                console.error("Errore lettura Canvas:", e);
                glassCtx.fillStyle = 'rgba(255,255,255,0.1)';
                glassCtx.fillRect(0, 0, W, H);
            }
        }
    </script>

    <!-- SCRIPT 2: Logica Autenticazione con Credenziali Frammentate -->
    <script>
        const SALT = "MeowGoDevSSO2026_";

        // Matrice di frammenti di credenziali obfuscati in Base64
        const _vault = {
            a: ["TWFudWVsMjU3", "dGVhbUBt", "duaXp6dUBn"],
            b: ["ZXJhMTE3MUBn", "Ng==", "bWVkdXNhODg="],
            c: ["bWFudWVsbWFu", "YW50b3NjdW", "ZW93Z28uaXQ6"],
            d: ["bWFpbC5jb206", "MTAz", "TWVvd0dvMjAy"]
        };

        // Calcola dinamicamente le impronte autorizzate dai frammenti
        async function getAuthorizedDigests() {
            const routes = [
                [_vault.c[0], _vault.b[0], _vault.d[0], _vault.a[0], _vault.d[1]], // Credenziale 1
                [_vault.c[1], _vault.a[2], _vault.d[0], _vault.b[2]],               // Credenziale 2
                [_vault.a[1], _vault.c[2], _vault.d[2], _vault.b[1]]                // Credenziale 3
            ];

            const digests = [];
            for (const route of routes) {
                const rawPair = atob(route.join(''));
                const digest = await computeSHA256(SALT + rawPair);
                digests.push(digest);
            }
            return digests;
        }

        async function computeSHA256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/30', 'text-red-200', 'bg-emerald-500/20', 'border-emerald-500/30', 'text-emerald-200');
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-500/20', 'border', 'border-red-500/30', 'text-red-200');
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> ${msg}`;
            } else {
                alertBox.classList.add('bg-emerald-500/20', 'border', 'border-emerald-500/30', 'text-emerald-200');
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1.5"></i> ${msg}`;
            }
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideAlert();

            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnSpinner = document.getElementById('btnSpinner');

            submitBtn.disabled = true;
            btnText.textContent = "Verifica...";
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            try {
                const combinedString = SALT + emailInput + ":" + passwordInput;
                const computedDigest = await computeSHA256(combinedString);
                
                // Ricompone i frammenti per la verifica
                const authorizedDigests = await getAuthorizedDigests();

                setTimeout(() => {
                    if (authorizedDigests.includes(computedDigest)) {
                        showAlert('Autenticato con successo! Reindirizzamento...', 'success');
                        sessionStorage.setItem('meowgo_sso_authenticated', 'true');
                        setTimeout(() => { window.location.href = 'dev/index.html'; }, 800);
                    } else {
                        submitBtn.disabled = false;
                        btnText.textContent = "Autenticati";
                        btnIcon.classList.remove('hidden');
                        btnSpinner.classList.add('hidden');
                        showAlert('Credenziali errate o account non autorizzato.');
                    }
                }, 400);

            } catch (err) {
                console.error("Crypto error:", err);
                submitBtn.disabled = false;
                btnText.textContent = "Autenticati";
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
                showAlert('Errore API Crypto. Assicurati di usare un Server Locale (http/https).');
            }
        }
    </script>
</body>
</html>
